<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBSL Sector Classification Finder</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for English and Sinhala -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
        }

        /* Animated Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animated {
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #0369a1, #0ea5e9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Glassmorphism Container */
        .glass-panel {
            position: relative;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: -1;
            pointer-events: none;
        }

        /* Dark Yellow Rounded Box with White Outline */
        .title-badge-box {
            background-color: #eab308;
            border: 3px solid #ffffff;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* Solid Black Title */
        .title-black-solid {
            color: #000000;
            font-family: 'Inter', 'Arial Black', sans-serif;
            font-weight: 900;
            line-height: 1.2;
        }

        /* Result Card Reveal Animation */
        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-card-reveal {
            animation: cardReveal 0.25s ease-out forwards;
        }

        /* Custom scrollbar for dropdown */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-animated text-slate-800 antialiased min-h-screen flex flex-col items-center pt-5 pb-10 px-4 sm:px-6 relative overflow-x-hidden">

    <!-- Top Right Credit with Profile Picture -->
    <div class="absolute top-4 right-4 sm:right-6 bg-white/10 px-4 py-2 rounded-full backdrop-blur-md border border-white/20 flex items-center gap-3 shadow-sm z-50">
        <img src="04184.jpg" alt="Yazi" class="w-8 h-8 rounded-full object-cover border border-white/50">
        <span class="text-sm text-white font-semibold tracking-wider">By Yazi</span>
    </div>

    <!-- Header -->
    <header class="text-center max-w-5xl mb-8 w-full pt-2 px-2">
        <div class="inline-block title-badge-box rounded-2xl px-5 py-2.5 sm:px-8 sm:py-4 mb-4">
            <h1 class="text-lg sm:text-3xl md:text-4xl lg:text-5xl font-black uppercase tracking-normal sm:tracking-wide title-black-solid whitespace-nowrap">
                SECTOR CLASSIFICATION
            </h1>
        </div>
        <p class="text-blue-50 font-medium tracking-wide text-sm sm:text-lg">
            Find the correct main and sub sectors for your profession
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl relative z-20 glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl">
        
        <!-- Search Section -->
        <div id="searchWrapper" class="relative w-full mb-6">
            <div class="relative flex items-center">
                <!-- Search Icon -->
                <svg class="absolute left-4 w-6 h-6 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                
                <input 
                    type="text" 
                    id="searchInput" 
                    autocomplete="off"
                    spellcheck="false"
                    class="w-full pl-12 pr-11 py-4 rounded-xl bg-white text-slate-800 border-2 border-transparent shadow-lg focus:ring-4 focus:ring-blue-400/50 focus:border-blue-400 text-base sm:text-lg transition-all outline-none" 
                    placeholder="රැකියාව සොයන්න (Search profession... ex: Farmer, Mason, Driver)"
                >
                
                <!-- Clear Button -->
                <button type="button" id="clearBtn" aria-label="Clear search" class="absolute right-4 text-slate-400 hover:text-slate-600 hidden transition-colors p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Autocomplete Dropdown -->
            <ul id="dropdownMenu" class="w-full bg-white mt-2 border border-slate-200 rounded-xl shadow-2xl max-h-64 overflow-y-auto custom-scrollbar hidden relative z-50">
                <!-- Dropdown items injected via JS -->
            </ul>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden bg-white rounded-2xl shadow-xl border border-white/40 overflow-hidden">
            <!-- Card Header (Job Title) -->
            <div class="bg-blue-50 border-b border-blue-100 p-6">
                <p class="text-xs sm:text-sm font-bold text-blue-600 uppercase tracking-wider mb-1">Selected Profession</p>
                <h3 id="displayJobTitle" class="text-xl sm:text-2xl font-bold text-slate-800"></h3>
            </div>
            
            <!-- Card Body (Sectors) -->
            <div class="p-6 space-y-6">
                <!-- Main Sector -->
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Main Sector</p>
                    <div id="displayMainSectorContainer"></div>
                </div>

                <!-- Divider -->
                <hr class="border-slate-200">

                <!-- Sub Sector -->
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Sub Sector</p>
                    <div id="displaySubSectorContainer"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const jobMappings = [
            { job: "Farmer (Paddy) / වී ගොවියා", keywords: ["farmer", "paddy", "වී", "ගොවියා", "goviya"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Paddy" },
            { job: "Vegetable/Fruit Farmer / එළවළු ගොවියා", keywords: ["farmer", "vegetable", "fruit", "එළවළු", "පලතුරු"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Fruits and vegetables" },
            { job: "Tea Estate Worker / තේ වතු කම්කරු", keywords: ["tea", "estate", "තේ", "වතු"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Tea" },
            { job: "Rubber Tapper / රබර් කපන්නා", keywords: ["rubber", "රබර්"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Rubber" },
            { job: "Fisherman / ධීවරයා", keywords: ["fisherman", "ධීවරයා", "මාළු", "fishing", "fish"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Fishing and Aquaculture" },
            { job: "Dairy/Poultry Farmer / සත්ත්ව පාලනය", keywords: ["animal", "poultry", "dairy", "සත්ත්ව", "කුකුල්", "farm"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Animal husbandry & mixed farming" },
            { job: "Garment Worker / ඇඟලුම් සේවක", keywords: ["garment", "ඇඟලුම්", "juki"], main: "MANUFACTURING", sub: "Manufacture of textiles and apparel" },
            { job: "Tailor / ඇඳුම් මසන්නා", keywords: ["tailor", "මැහුම්", "sewing", "ඇඳුම්"], main: "MANUFACTURING", sub: "Manufacture of textiles and apparel" },
            { job: "Carpenter / වඩුවා", keywords: ["carpenter", "වඩු", "wood", "furniture"], main: "MANUFACTURING", sub: "Manufacture of wooden products" },
            { job: "Bakery Owner / බේකරි හිමිකරු", keywords: ["bakery", "බේකරි", "food", "කෑම"], main: "MANUFACTURING", sub: "Manufacture of food products and beverages" },
            { job: "Gem Miner/Jeweler / මැණික් හා ස්වර්ණාභරණ", keywords: ["gem", "jewelry", "මැණික්", "රත්තරන්"], main: "MANUFACTURING", sub: "Manufacture of Gem, jewelry & related articles, musical instruments, sports goods, medical and dental instruments and other manufacturing" },
            { job: "Hotel Worker/Owner / හෝටල් සේවක", keywords: ["hotel", "හෝටල්", "waiter", "receptionist"], main: "TOURISM", sub: "Provision of accommodation services" },
            { job: "Tour Guide / සංචාරක මඟපෙන්වන්නා", keywords: ["tour", "guide", "ගයිඩ්", "සංචාරක"], main: "TOURISM", sub: "Travel agency, tour operator, reservation service and related activities" },
            { job: "Three-wheeler / Tuk Tuk Driver / ත්‍රීවීල් රියදුරු", keywords: ["driver", "three wheeler", "tuk tuk", "ත්‍රී වීල්", "රියදුරු"], main: "TRANSPORTATION & STORAGE", sub: "Land transport" },
            { job: "Bus/Van/Lorry Driver / බස්/වෑන් රියදුරු", keywords: ["bus", "van", "lorry", "driver", "බස්", "වෑන්", "රියදුරු"], main: "TRANSPORTATION & STORAGE", sub: "Land transport" },
            { job: "Courier/Delivery Rider / බෙදාහරින්නා", keywords: ["delivery", "courier", "rider", "බෙදාහැරීම්", "ubereats", "pickme"], main: "TRANSPORTATION & STORAGE", sub: "Postal and courier services" },
            { job: "Mason / මේසන් බාස්", keywords: ["mason", "මේසන්", "බාස්", "baas", "construction", "ගෙවල්"], main: "CONSTRUCTION & INFRASTRUCTURE DEVELOPMENT", sub: "Purchasing, construction or renovation of a house" },
            { job: "Electrician/Plumber / විදුලි කාර්මික", keywords: ["electrician", "plumber", "විදුලි", "කාර්මික"], main: "CONSTRUCTION & INFRASTRUCTURE DEVELOPMENT", sub: "Specialized construction activities and construction of other civil engineering projects" },
            { job: "Grocery Store Owner / සිල්ලර කඩ හිමිකරු", keywords: ["grocery", "shop", "කඩේ", "mudalali", "සිල්ලර", "retail"], main: "WHOLESALE & RETAIL TRADE", sub: "Sale of food, beverages, tobacco and agricultural materials" },
            { job: "Hardware Store Owner / හාඩ්වෙයාර් හිමිකරු", keywords: ["hardware", "හාඩ්වෙයාර්", "shop"], main: "WHOLESALE & RETAIL TRADE", sub: "Sale of building materials" },
            { job: "Pharmacy Owner / ෆාමසි හිමිකරු", keywords: ["pharmacy", "ෆාමසි", "medicine", "බෙහෙත්"], main: "WHOLESALE & RETAIL TRADE", sub: "Sale of pharmaceutical products and health care products" },
            { job: "Software Engineer / මෘදුකාංග ඉංජිනේරු", keywords: ["software", "engineer", "IT", "පරිගණක"], main: "INFORMATION TECHNOLOGY AND COMMUNICATION", sub: "Computer programming, computer related consultancy, computer facilities management activities and software development activities" },
            { job: "Bank Employee / බැංකු සේවක", keywords: ["bank", "බැංකු", "manager", "clerk"], main: "FINANCIAL SERVICES", sub: "Licensed banks" },
            { job: "Accountant / ගණකාධිකාරී", keywords: ["accountant", "ගණකාධිකාරී", "audit"], main: "PROFESSIONAL, SCIENTIFIC & TECHNICAL ACTIVITIES", sub: "Accounting, legal & consultancy services" },
            { job: "Teacher / ගුරුවරයා", keywords: ["teacher", "ගුරු", "tutor", "පන්තියේ"], main: "EDUCATION", sub: "Development of primary education and secondary education" },
            { job: "Doctor/Nurse / වෛද්‍ය/හෙද", keywords: ["doctor", "nurse", "වෛද්‍ය", "හෙද", "hospital", "රෝහල්"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Providing of health care services (includes hospitals and other health care activities)" },
            { job: "Security Guard / ආරක්ෂක නිලධාරී", keywords: ["security", "ආරක්ෂක", "guard"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Private security and investigation activities" },
            { job: "Mechanic/Garage Owner / වාහන කාර්මික", keywords: ["mechanic", "garage", "ගරාජ්", "බාස්", "repair", "vehicle"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Repair and maintenance of vehicles, equipment, personal and household goods" },
            { job: "Barber/Beautician / සැලෝන්/කොණ්ඩා කපන්නා", keywords: ["barber", "salon", "beautician", "සැලෝන්", "කොණ්ඩා"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Other social services" },
            { job: "Office Clerk / ලිපිකරු", keywords: ["clerk", "admin", "ලිපිකරු", "office", "කාර්යාල"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Office administrative, office support and other business support activities" },
            { job: "Pensioner (Loans) / විශ්‍රාමික", keywords: ["pensioner", "විශ්‍රාමික", "loan"], main: "CONSUMPTION", sub: "Personal loans for pensioners" }
        ];

        function initSectorApp() {
            const searchWrapper = document.getElementById('searchWrapper');
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            const dropdownMenu = document.getElementById('dropdownMenu');
            const resultCard = document.getElementById('resultCard');
            const displayJobTitle = document.getElementById('displayJobTitle');
            const displayMainSectorContainer = document.getElementById('displayMainSectorContainer');
            const displaySubSectorContainer = document.getElementById('displaySubSectorContainer');

            if (!searchInput || !dropdownMenu || !resultCard) return;

            let currentMatches = [];

            function showDropdown() {
                dropdownMenu.classList.remove('hidden');
            }

            function hideDropdown() {
                dropdownMenu.classList.add('hidden');
            }

            function showResultCard() {
                resultCard.classList.remove('hidden', 'animate-card-reveal');
                void resultCard.offsetWidth;
                resultCard.classList.add('animate-card-reveal');
            }

            function hideResultCard() {
                resultCard.classList.add('hidden');
                resultCard.classList.remove('animate-card-reveal');
            }

            function selectJob(jobItem) {
                searchInput.value = jobItem.job;
                clearBtn.classList.remove('hidden');
                hideDropdown();

                displayJobTitle.textContent = jobItem.job;

                displayMainSectorContainer.innerHTML = `
                    <span class="bg-yellow-300 px-3 py-1.5 font-bold text-gray-900 rounded shadow-sm inline-block">
                        ${jobItem.main}
                    </span>
                `;

                displaySubSectorContainer.innerHTML = `
                    <span class="bg-green-300 px-3 py-1.5 font-bold text-gray-900 rounded shadow-sm inline-block">
                        ${jobItem.sub}
                    </span>
                `;

                showResultCard();
            }

            function renderDropdown(matches) {
                dropdownMenu.innerHTML = '';

                if (matches.length === 0) {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-4 text-slate-500 italic';
                    li.textContent = 'No matching professions found.';
                    dropdownMenu.appendChild(li);
                    showDropdown();
                    return;
                }

                matches.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-3 hover:bg-blue-50 active:bg-blue-100 cursor-pointer border-b border-slate-100 last:border-none text-slate-700 font-medium flex items-center gap-3 transition-colors';
                    li.innerHTML = `
                        <svg class="w-5 h-5 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <span>${item.job}</span>
                    `;
                    li.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectJob(item);
                    });
                    dropdownMenu.appendChild(li);
                });

                showDropdown();
            }

            function filterJobs(rawQuery) {
                const query = (rawQuery || '').trim().toLowerCase();

                if (query.length === 0) {
                    clearBtn.classList.add('hidden');
                    hideDropdown();
                    hideResultCard();
                    currentMatches = [];
                    return;
                }

                clearBtn.classList.remove('hidden');

                // Match suggestions starting with the typed letter(s)
                currentMatches = jobMappings.filter(item => {
                    const titleParts = item.job.toLowerCase().split('/').map(part => part.trim());
                    const titleStarts = titleParts.some(part => part.startsWith(query));
                    const keywordStarts = item.keywords.some(kw => kw.toLowerCase().startsWith(query));
                    return titleStarts || keywordStarts;
                });

                renderDropdown(currentMatches);
            }

            // Trigger suggestions only when typing/pressing keys
            searchInput.addEventListener('input', () => {
                filterJobs(searchInput.value);
            });

            searchInput.addEventListener('keyup', (e) => {
                if (['Enter', 'ArrowUp', 'ArrowDown', 'Escape'].includes(e.key)) return;
                filterJobs(searchInput.value);
            });

            // Select top match on Enter, close dropdown on Escape
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && currentMatches.length > 0) {
                    e.preventDefault();
                    selectJob(currentMatches[0]);
                } else if (e.key === 'Escape') {
                    hideDropdown();
                }
            });

            // Clear button
            clearBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                searchInput.value = '';
                currentMatches = [];
                clearBtn.classList.add('hidden');
                hideDropdown();
                hideResultCard();
                searchInput.focus();
            });

            // Close dropdown when clicking outside search area
            document.addEventListener('click', (e) => {
                if (!searchWrapper.contains(e.target)) {
                    hideDropdown();
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initSectorApp);
        } else {
            initSectorApp();
        }
    </script>
</body>
</html>
