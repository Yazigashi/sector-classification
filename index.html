<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBSL Sector Classification Finder</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for English and Sinhala -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for dropdown */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 relative">

    <!-- Top Right Credit -->
    <div class="absolute top-4 right-4 sm:right-6 text-xs text-slate-400 font-medium tracking-wider">
        By Yazi
    </div>

    <!-- Header -->
    <header class="text-center max-w-3xl mb-10 w-full pt-2">
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-slate-900 leading-tight mb-2 uppercase tracking-wide">
            SECTOR CLASSIFICATION
        </h1>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl relative z-10">
        
        <!-- Search Section -->
        <div class="relative w-full mb-8">
            <div class="relative flex items-center">
                <!-- Search Icon -->
                <svg class="absolute left-4 w-6 h-6 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                
                <input 
                    type="text" 
                    id="searchInput" 
                    autocomplete="off"
                    class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-300 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-lg transition-all outline-none" 
                    placeholder="රැකියාව සොයන්න (Search profession... ex: Farmer, Mason, Driver)"
                >
                
                <!-- Clear Button -->
                <button id="clearBtn" class="absolute right-4 text-slate-400 hover:text-slate-600 hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Autocomplete Dropdown -->
            <ul id="dropdownMenu" class="absolute z-50 w-full bg-white mt-1 border border-slate-200 rounded-xl shadow-lg max-h-64 overflow-y-auto custom-scrollbar hidden">
                <!-- Dropdown items will be injected here via JS -->
            </ul>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden transition-all duration-300 transform scale-95 opacity-0">
            <!-- Card Header (Job Title) -->
            <div class="bg-blue-50 border-b border-slate-200 p-6">
                <p class="text-sm font-semibold text-blue-600 uppercase tracking-wider mb-1">Selected Profession</p>
                <h3 id="displayJobTitle" class="text-xl sm:text-2xl font-bold text-slate-800"></h3>
            </div>
            
            <!-- Card Body (Sectors) -->
            <div class="p-6 space-y-6">
                <!-- Main Sector -->
                <div>
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Main Sector</p>
                    <div id="displayMainSectorContainer">
                        <!-- Yellow Highlighted text injected here -->
                    </div>
                </div>

                <!-- Divider -->
                <hr class="border-slate-100">

                <!-- Sub Sector -->
                <div>
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-2">Sub Sector</p>
                    <p id="displaySubSector" class="text-lg font-medium text-slate-700"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Exact Data Mapping Provided
        const jobMappings = [
            { job: "Farmer (Paddy) / වී ගොවියා", keywords: ["farmer", "paddy", "වී", "ගොවියා", "goviya"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Paddy" },
            { job: "Vegetable/Fruit Farmer / එළවළු ගොවියා", keywords: ["farmer", "vegetable", "fruit", "එළවළු", "පලතුරු"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Fruits and vegetables" },
            { job: "Tea Estate Worker / තේ වතු කම්කරු", keywords: ["tea", "estate", "තේ", "වතු"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Tea" },
            { job: "Rubber Tapper / රබර් කපන්නා", keywords: ["rubber", "රබර්"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Rubber" },
            { job: "Fisherman / ධීවරයා", keywords: ["fisherman", "ධීවරයා", "මාළු", "fishing", "fish"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Fishing and Aquaculture" },
            { job: "Dairy/Poultry Farmer / සත්ත්ව පාලනය", keywords: ["animal", "poultry", "dairy", "සත්ත්ව", "කුකුල්", "farm"], main: "AGRICULTURE, FORESTRY & FISHING", sub: "Animal husbandry & mixed farming" },
            { job: "Garment Worker / ඇඟලුම් සේවක", keywords: ["garment", "ඇඟලුම්", "juki"], main: "MANUFACTURING", sub: "Manufacture of textiles and apparel" },
            { job: "Tailor / ඇඳුම් මසන්නා", keywords: ["tailor", "මැහුම්", "sewing", "ඇඳුම්"], main: "MANUFACTURING", sub: "Manufacture of textiles and apparel" },
            { job: "Carpenter / වඩුවා", keywords: ["carpenter", "වඩු", "wood", "furniture"], main: "MANUFACTURING", sub: "Manufacture of wooden products" },
            { job: "Bakery Owner / බේකරි හිමිකරු", keywords: ["bakery", "බේකරි", "food", "කෑම"], main: "MANUFACTURING", sub: "Manufacture of food products and beverages" },
            { job: "Gem Miner/Jeweler / මැණික් හා ස්වර්ණාභරණ", keywords: ["gem", "jewelry", "මැණික්", "රත්තරන්"], main: "MANUFACTURING", sub: "Manufacture of Gem, jewelry & related articles, musical instruments, sports goods, medical and dental instruments and other manufacturing" },
            { job: "Hotel Worker/Owner / හෝටල් සේවක", keywords: ["hotel", "හෝටල්", "waiter", "receptionist"], main: "TOURISM", sub: "Provision of accommodation services" },
            { job: "Tour Guide / සංචාරක මඟපෙන්වන්නා", keywords: ["tour", "guide", "ගයිඩ්", "සංචාරක"], main: "TOURISM", sub: "Travel agency, tour operator, reservation service and related activities" },
            { job: "Three-wheeler / Tuk Tuk Driver / ත්‍රීවීල් රියදුරු", keywords: ["driver", "three wheeler", "tuk tuk", "ත්‍රී වීල්", "රියදුරු"], main: "TRANSPORTATION & STORAGE", sub: "Land transport" },
            { job: "Bus/Van/Lorry Driver / බස්/වෑන් රියදුරු", keywords: ["bus", "van", "lorry", "driver", "බස්", "වෑන්", "රියදුරු"], main: "TRANSPORTATION & STORAGE", sub: "Land transport" },
            { job: "Courier/Delivery Rider / බෙදාහරින්නා", keywords: ["delivery", "courier", "rider", "බෙදාහැරීම්", "ubereats", "pickme"], main: "TRANSPORTATION & STORAGE", sub: "Postal and courier services" },
            { job: "Mason / මේසන් බාස්", keywords: ["mason", "මේසන්", "බාස්", "baas", "construction", "ගෙවල්"], main: "CONSTRUCTION & INFRASTRUCTURE DEVELOPMENT", sub: "Purchasing, construction or renovation of a house" },
            { job: "Electrician/Plumber / විදුලි කාර්මික", keywords: ["electrician", "plumber", "විදුලි", "කාර්මික"], main: "CONSTRUCTION & INFRASTRUCTURE DEVELOPMENT", sub: "Specialized construction activities and construction of other civil engineering projects" },
            { job: "Grocery Store Owner / සිල්ලර කඩ හිමිකරු", keywords: ["grocery", "shop", "කඩේ", "mudalali", "සිල්ලර", "retail"], main: "WHOLESALE & RETAIL TRADE", sub: "Sale of food, beverages, tobacco and agricultural materials" },
            { job: "Hardware Store Owner / හාඩ්වෙයාර් හිමිකරු", keywords: ["hardware", "හාඩ්වෙයාර්", "shop"], main: "WHOLESALE & RETAIL TRADE", sub: "Sale of building materials" },
            { job: "Pharmacy Owner / ෆාමසි හිමිකරු", keywords: ["pharmacy", "ෆාමසි", "medicine", "බෙහෙත්"], main: "WHOLESALE & RETAIL TRADE", sub: "Sale of pharmaceutical products and health care products" },
            { job: "Software Engineer / මෘදුකාංග ඉංජිනේරු", keywords: ["software", "engineer", "IT", "පරිගණක"], main: "INFORMATION TECHNOLOGY AND COMMUNICATION", sub: "Computer programming, computer related consultancy, computer facilities management activities and software development activities" },
            { job: "Bank Employee / බැංකු සේවක", keywords: ["bank", "බැංකු", "manager", "clerk"], main: "FINANCIAL SERVICES", sub: "Licensed banks" },
            { job: "Accountant / ගණකාධිකාරී", keywords: ["accountant", "ගණකාධිකාරී", "audit"], main: "PROFESSIONAL, SCIENTIFIC & TECHNICAL ACTIVITIES", sub: "Accounting, legal & consultancy services" },
            { job: "Teacher / ගුරුවරයා", keywords: ["teacher", "ගුරු", "tutor", "පන්තියේ"], main: "EDUCATION", sub: "Development of primary education and secondary education" },
            { job: "Doctor/Nurse / වෛද්‍ය/හෙද", keywords: ["doctor", "nurse", "වෛද්‍ය", "හෙද", "hospital", "රෝහල්"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Providing of health care services (includes hospitals and other health care activities)" },
            { job: "Security Guard / ආරක්ෂක නිලධාරී", keywords: ["security", "ආරක්ෂක", "guard"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Private security and investigation activities" },
            { job: "Mechanic/Garage Owner / වාහන කාර්මික", keywords: ["mechanic", "garage", "ගරාජ්", "බාස්", "repair", "vehicle"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Repair and maintenance of vehicles, equipment, personal and household goods" },
            { job: "Barber/Beautician / සැලෝන්/කොණ්ඩා කපන්නා", keywords: ["barber", "salon", "beautician", "සැලෝන්", "කොණ්ඩා"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Other social services" },
            { job: "Office Clerk / ලිපිකරු", keywords: ["clerk", "admin", "ලිපිකරු", "office", "කාර්යාල"], main: "HEALTH CARE, SOCIAL SERVICES & SUPPORT SERVICES", sub: "Office administrative, office support and other business support activities" },
            { job: "Pensioner (Loans) / විශ්‍රාමික", keywords: ["pensioner", "විශ්‍රාමික", "loan"], main: "CONSUMPTION", sub: "Personal loans for pensioners" }
        ];

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const resultCard = document.getElementById('resultCard');
        
        const displayJobTitle = document.getElementById('displayJobTitle');
        const displayMainSectorContainer = document.getElementById('displayMainSectorContainer');
        const displaySubSector = document.getElementById('displaySubSector');

        // Event Listener for Input
        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            
            // Show/Hide clear button
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                hideDropdown();
                hideResultCard();
                return;
            }

            // Filter logic: matches job string OR any keyword
            const matches = jobMappings.filter(item => {
                const jobMatch = item.job.toLowerCase().includes(query);
                const keywordMatch = item.keywords.some(kw => kw.toLowerCase().includes(query));
                return jobMatch || keywordMatch;
            });

            renderDropdown(matches, query);
        });

        // Function to render dropdown items
        function renderDropdown(matches, query) {
            dropdownMenu.innerHTML = ''; // Clear previous

            if (matches.length === 0) {
                const li = document.createElement('li');
                li.className = 'px-4 py-3 text-slate-500 italic';
                li.textContent = 'No matching professions found.';
                dropdownMenu.appendChild(li);
                showDropdown();
                return;
            }

            matches.forEach(item => {
                const li = document.createElement('li');
                li.className = 'px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-slate-100 last:border-none text-slate-700 font-medium flex items-center gap-2';
                
                // Add a small icon to list items
                li.innerHTML = `
                    <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span>${item.job}</span>
                `;
                
                // Click event to select job
                li.addEventListener('click', () => {
                    selectJob(item);
                });
                
                dropdownMenu.appendChild(li);
            });

            showDropdown();
        }

        // Function when a job is selected
        function selectJob(jobItem) {
            // Update input text
            searchInput.value = jobItem.job;
            
            // Hide dropdown
            hideDropdown();

            // Populate Card Data
            displayJobTitle.textContent = jobItem.job;
            
            // Inject Main Sector with yellow highlight styling matching the PDF source
            displayMainSectorContainer.innerHTML = `
                <span class="bg-yellow-300 px-3 py-1.5 font-bold text-gray-900 rounded shadow-sm inline-block">
                    ${jobItem.main}
                </span>
            `;
            
            displaySubSector.textContent = jobItem.sub;

            // Show Card with animation
            showResultCard();
        }

        // Helper Functions for UI states
        function showDropdown() {
            dropdownMenu.classList.remove('hidden');
        }

        function hideDropdown() {
            dropdownMenu.classList.add('hidden');
        }

        function showResultCard() {
            resultCard.classList.remove('hidden');
            // Small delay to trigger CSS transition
            setTimeout(() => {
                resultCard.classList.remove('scale-95', 'opacity-0');
                resultCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function hideResultCard() {
            resultCard.classList.remove('scale-100', 'opacity-100');
            resultCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                resultCard.classList.add('hidden');
            }, 300); // Wait for transition to finish
        }

        // Clear button event
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            hideDropdown();
            hideResultCard();
            searchInput.focus();
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !dropdownMenu.contains(e.target)) {
                hideDropdown();
            }
        });
        
        // Handle input click to show list if there is value
        searchInput.addEventListener('click', function() {
            if (this.value.trim().length > 0 && dropdownMenu.children.length > 0) {
                showDropdown();
            }
        });
    </script>
</body>
</html>
